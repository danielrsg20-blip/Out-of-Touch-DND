<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="d20bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="100%" stop-color="#0d1428"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer hexagon body -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28"
    fill="url(#d20bg)" stroke="#e4a853" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Inner highlight border -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28"
    fill="none" stroke="#e4a853" stroke-width="0.8" stroke-linejoin="round"
    opacity="0.25" transform="scale(0.87) translate(6.5, 6.5)"/>
  <!-- Face division lines -->
  <line x1="50" y1="6"  x2="10" y2="72" stroke="#e4a853" stroke-width="0.7" opacity="0.4"/>
  <line x1="50" y1="6"  x2="90" y2="72" stroke="#e4a853" stroke-width="0.7" opacity="0.4"/>
  <line x1="50" y1="94" x2="10" y2="28" stroke="#e4a853" stroke-width="0.7" opacity="0.4"/>
  <line x1="50" y1="94" x2="90" y2="28" stroke="#e4a853" stroke-width="0.7" opacity="0.4"/>
  <line x1="10" y1="28" x2="90" y2="28" stroke="#e4a853" stroke-width="0.6" opacity="0.3"/>
  <line x1="10" y1="72" x2="90" y2="72" stroke="#e4a853" stroke-width="0.6" opacity="0.3"/>
  <!-- "20" numeral -->
  <text x="50" y="57" text-anchor="middle"
    fill="#e4a853" font-size="26" font-weight="bold"
    font-family="Georgia, 'Times New Roman', serif"
    filter="url(#glow)">20</text>
</svg>
