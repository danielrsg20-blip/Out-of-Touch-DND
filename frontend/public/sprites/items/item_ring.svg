<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- ring band -->
  <ellipse cx="16" cy="18" rx="10" ry="8" fill="none" stroke="#d4a843" stroke-width="3.5"/>
  <!-- inner shadow -->
  <ellipse cx="16" cy="18" rx="7.5" ry="5.5" fill="none" stroke="#b08830" stroke-width="1" opacity="0.4"/>
  <!-- setting mount -->
  <rect x="12" y="7" width="8" height="6" rx="2" fill="#d4a843"/>
  <!-- gemstone -->
  <polygon points="16,5 20,9 16,13 12,9" fill="#4488cc"/>
  <!-- gem facet highlight -->
  <polygon points="16,5 18,8 16,10 14,8" fill="#66aaee" opacity="0.5"/>
  <!-- gem sparkle -->
  <circle cx="14.5" cy="7.5" r="0.8" fill="#aaddff" opacity="0.7"/>
  <!-- band highlight -->
  <ellipse cx="16" cy="18" rx="10" ry="8" fill="none" stroke="#e8c060" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 5"/>
</svg>
