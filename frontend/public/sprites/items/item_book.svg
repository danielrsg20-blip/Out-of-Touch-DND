<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- book body -->
  <rect x="6" y="4" width="20" height="25" rx="2" fill="#4a2a1a"/>
  <!-- pages (visible from side) -->
  <rect x="8" y="5" width="17" height="23" rx="1" fill="#e8e0d0"/>
  <!-- cover front -->
  <rect x="6" y="4" width="18" height="25" rx="2" fill="#8b2020"/>
  <!-- spine -->
  <rect x="6" y="4" width="3" height="25" rx="1" fill="#6a1818"/>
  <!-- spine ridges -->
  <line x1="7.5" y1="8" x2="7.5" y2="10" stroke="#4a1010" stroke-width="0.8" opacity="0.5"/>
  <line x1="7.5" y1="14" x2="7.5" y2="16" stroke="#4a1010" stroke-width="0.8" opacity="0.5"/>
  <line x1="7.5" y1="20" x2="7.5" y2="22" stroke="#4a1010" stroke-width="0.8" opacity="0.5"/>
  <!-- cover border trim -->
  <rect x="9" y="6" width="13" height="21" rx="1" fill="none" stroke="#d4a843" stroke-width="0.8"/>
  <!-- center emblem -->
  <circle cx="15.5" cy="16.5" r="3.5" fill="none" stroke="#d4a843" stroke-width="1.2"/>
  <circle cx="15.5" cy="16.5" r="1.5" fill="#d4a843"/>
  <!-- corner ornaments -->
  <rect x="9.5" y="6.5" width="2.5" height="2.5" rx="0.5" fill="none" stroke="#d4a843" stroke-width="0.5" opacity="0.6"/>
  <rect x="19" y="24" width="2.5" height="2.5" rx="0.5" fill="none" stroke="#d4a843" stroke-width="0.5" opacity="0.6"/>
</svg>
