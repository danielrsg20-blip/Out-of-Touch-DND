<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- handle ring -->
  <path d="M12 4 Q16 0 20 4" stroke="#8a9aaa" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- top cap -->
  <rect x="11" y="4" width="10" height="3" rx="1.5" fill="#8a9aaa"/>
  <!-- chimney -->
  <rect x="14" y="1" width="4" height="4" rx="1" fill="#6a7a8a"/>
  <!-- glass body -->
  <rect x="10" y="7" width="12" height="16" rx="2" fill="#2a3a2a" opacity="0.4"/>
  <rect x="10" y="7" width="12" height="16" rx="2" fill="none" stroke="#8a9aaa" stroke-width="1.2"/>
  <!-- flame -->
  <ellipse cx="16" cy="16" rx="3" ry="5" fill="#e8a020"/>
  <ellipse cx="16" cy="15" rx="2" ry="3.5" fill="#f0c040"/>
  <ellipse cx="16" cy="14" rx="1" ry="2" fill="#fff0a0" opacity="0.7"/>
  <!-- glow -->
  <ellipse cx="16" cy="16" rx="8" ry="10" fill="#e8a020" opacity="0.08"/>
  <!-- glass frame bars -->
  <line x1="10" y1="15" x2="22" y2="15" stroke="#8a9aaa" stroke-width="0.6" opacity="0.4"/>
  <!-- bottom base -->
  <rect x="10" y="23" width="12" height="3" rx="1.5" fill="#8a9aaa"/>
  <!-- fuel base -->
  <rect x="12" y="26" width="8" height="4" rx="2" fill="#6a7a8a"/>
</svg>
