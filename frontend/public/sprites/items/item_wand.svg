<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- wand shaft -->
  <rect x="14.5" y="8" width="3" height="22" rx="1.5" fill="#5a3a20"/>
  <!-- shaft grain -->
  <line x1="15.5" y1="10" x2="15.5" y2="28" stroke="#4a2a10" stroke-width="0.5" opacity="0.4"/>
  <!-- carved rings -->
  <rect x="14" y="14" width="4" height="1.2" rx="0.6" fill="#7a5a30"/>
  <rect x="14" y="18" width="4" height="1.2" rx="0.6" fill="#7a5a30"/>
  <rect x="14" y="22" width="4" height="1.2" rx="0.6" fill="#7a5a30"/>
  <!-- handle wrap -->
  <rect x="13.5" y="25" width="5" height="4" rx="1.5" fill="#8b5a2b"/>
  <!-- gem tip mount -->
  <polygon points="16,2 19.5,8 12.5,8" fill="#d4a843"/>
  <!-- gem -->
  <circle cx="16" cy="5" r="2.5" fill="#9b59b6"/>
  <!-- gem glow -->
  <circle cx="16" cy="5" r="4" fill="#9b59b6" opacity="0.15"/>
  <!-- gem highlight -->
  <circle cx="15" cy="4" r="0.8" fill="#cc88ee" opacity="0.6"/>
</svg>
