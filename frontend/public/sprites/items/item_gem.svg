<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- gem shadow -->
  <ellipse cx="16" cy="28" rx="8" ry="2" fill="#000" opacity="0.15"/>
  <!-- gem body (hexagonal cut) -->
  <polygon points="16,3 26,10 26,22 16,29 6,22 6,10" fill="#3498db"/>
  <!-- top facets -->
  <polygon points="16,3 26,10 16,14 6,10" fill="#5dade2"/>
  <!-- center facet -->
  <polygon points="6,10 16,14 6,22" fill="#2e86c1" opacity="0.7"/>
  <polygon points="26,10 16,14 26,22" fill="#2e86c1" opacity="0.5"/>
  <!-- bottom facets -->
  <polygon points="16,29 6,22 16,14" fill="#1a5276" opacity="0.8"/>
  <polygon points="16,29 26,22 16,14" fill="#1a5276" opacity="0.6"/>
  <!-- edge lines -->
  <polygon points="16,3 26,10 26,22 16,29 6,22 6,10" fill="none" stroke="#85c1e9" stroke-width="0.6" opacity="0.5"/>
  <line x1="16" y1="3" x2="16" y2="29" stroke="#85c1e9" stroke-width="0.4" opacity="0.3"/>
  <line x1="6" y1="10" x2="26" y2="22" stroke="#85c1e9" stroke-width="0.4" opacity="0.2"/>
  <line x1="26" y1="10" x2="6" y2="22" stroke="#85c1e9" stroke-width="0.4" opacity="0.2"/>
  <!-- highlight sparkle -->
  <circle cx="12" cy="9" r="1.2" fill="#fff" opacity="0.4"/>
  <circle cx="11" cy="8" r="0.5" fill="#fff" opacity="0.6"/>
</svg>
